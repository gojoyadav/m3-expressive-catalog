# Project-wide Gradle settings.
# Optimized for machines with 4 GB RAM as mandated in GEMINI.md

# Limit JVM heap to 2048 MB to prevent OOM on 4 GB RAM systems
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable build caching for faster subsequent builds
org.gradle.caching=true

# Enable configuration caching to accelerate the build configuration phase
org.gradle.configuration-cache=true

# Execute tasks in parallel when possible
org.gradle.parallel=true

# Use AndroidX packages
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R class for faster incremental compiles and smaller APKs
android.nonTransitiveRClass=true
